<!doctype html><meta charset="utf-8"><title>BrowserLink interaction test</title>
<style>body{font:24px system-ui;background:#11243b;color:#e8f1ff;margin:0;padding:40px}h1{color:#70d9b4}button,input{font:24px system-ui;padding:12px;margin:10px 10px 10px 0}button{background:#70d9b4;border:0;border-radius:8px}#output{min-height:45px;color:#ffd48a}.panel{background:#203b59;padding:24px;border-radius:16px;margin:20px 0}footer{margin-top:700px}</style>
<h1>BrowserLink · Live browser</h1><div class="panel"><div id="session"></div><p id="clock"></p></div>
<button id="counter">Click count: 0</button><button id="reset">Reset</button>
<div><input id="text" placeholder="Type here / 输入文字" size="25"><button id="submit">Submit</button></div>
<div id="output">Waiting for game input</div><a href="second.html" style="color:#70d9b4">Test navigation →</a>
<footer>Scroll reached bottom ✓</footer>
<script>
if(!document.cookie.includes('browserlink_demo='))document.cookie='browserlink_demo=session-kept; SameSite=Strict; path=/';
document.getElementById('session').textContent='Existing tab session: '+document.cookie;
let count=0;counter.onclick=()=>counter.textContent='Click count: '+(++count);reset.onclick=()=>{count=0;counter.textContent='Click count: 0';};
submit.onclick=()=>{output.textContent='Received: '+text.value;};
text.onkeydown=e=>{if(e.key==='Enter')submit.click();};
setInterval(()=>clock.textContent='Live clock: '+new Date().toLocaleTimeString(),250);
</script>
